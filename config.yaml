# ==============================================================================
# LUNAR-X Central Configuration (Phase 1 + Phase 2 + Phase 3)
# ISRO Chandrayaan-2 Optical & Hyperspectral Image Correspondence System
# ==============================================================================

project:
  name: "LUNAR-X"
  version: "0.3.0"
  domain: "Space Technology - ISRO SIH 2026"
  problem_id: "SIH26166"

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  real_dir: "data/real"
  real_ohrc_dir: "data/real/ohrc"
  real_tmc2_dir: "data/real/tmc2"
  real_iirs_dir: "data/real/iirs"
  processed_dir: "data/processed"
  tiles_dir: "data/tiles"
  metadata_dir: "data/metadata"
  manifests_dir: "data/manifests"
  output_dir: "outputs"

ohrc:
  supported_extensions: [".tif", ".tiff", ".png", ".jpg", ".jpeg"]
  min_dimensions: [64, 64]
  max_dimensions: [65536, 65536]
  valid_bit_depths: [8, 16, 32]
  default_resolution_m: 0.25  # OHRC spatial resolution (~25 cm/pixel)

tmc2:
  supported_extensions: [".tif", ".tiff", ".png", ".jpg", ".jpeg"]
  min_dimensions: [32, 32]
  max_dimensions: [65536, 65536]
  valid_bit_depths: [8, 16, 32]
  default_resolution_m: 5.0  # TMC-2 spatial resolution (~5 meters/pixel)

iirs:
  supported_extensions: [".tif", ".tiff", ".npy", ".png", ".jpg", ".jpeg"]
  min_dimensions: [16, 16]
  max_dimensions: [65536, 65536]
  valid_bit_depths: [8, 16, 32]
  default_resolution_m: 100.0  # IIRS spatial resolution (~100 meters/pixel)
  pca_n_components: 3          # Number of principal components for dimensionality reduction
  bad_band_threshold_std: 1e-4 # Standard deviation threshold below which a band is marked bad

preprocessing:
  enabled: true
  radiometric_normalization: true
  stretch_percentiles: [1.0, 99.0]
  clahe:
    enabled: true
    clip_limit: 3.0
    tile_grid_size: [8, 8]
  denoise:
    enabled: true
    method: "gaussian"  # options: gaussian, non_local_means, median
    kernel_size: 3
  illumination_norm:
    enabled: true
    method: "high_pass"  # options: high_pass, homomorphic, divide_median
    sigma: 15.0
  edge_enhancement:
    enabled: false
    alpha: 0.5

tiling:
  enabled: false
  tile_size: 512
  overlap: 128
  min_valid_pixel_ratio: 0.1

correspondence:
  method: "sift"  # options: sift, orb, akaze
  sift:
    n_features: 5000
    contrast_threshold: 0.04
    edge_threshold: 10.0
    sigma: 1.6
  orb:
    n_features: 5000
    scale_factor: 1.2
    n_levels: 8
  akaze:
    threshold: 0.001
  matching:
    matcher: "flann"  # options: flann, bf
    ratio_threshold: 0.75  # Lowe's ratio test threshold
    cross_check: false
  ransac:
    reproj_threshold: 3.0
    max_iter: 2000
    confidence: 0.99
    method: "RANSAC"  # options: RANSAC, USAC_MAGSAC

cross_sensor:
  scale_normalization: true
  min_resample_dim: 256
  target_reference: "tmc2"
  ratio_threshold: 0.80
  ransac_threshold_px: 5.0
  min_inliers_for_valid: 6

cross_modal:
  use_gradient_magnitude: true
  min_resample_dim: 256
  ratio_threshold: 0.80
  ransac_threshold_px: 8.0

tri_sensor:
  max_loop_closure_error_px: 10.0
  consensus_threshold_m: 50.0

evaluation:
  grid_size: [8, 8]
  save_plots: true
  report_format: "json"
